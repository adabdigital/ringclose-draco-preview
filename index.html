<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ringclose (Draco) · sparkle preview</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0c0e12; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #title {
      position: absolute; top: 0; left: 0; right: 0; z-index: 2;
      padding: 16px; text-align: center; pointer-events: none;
      font: 400 20px/1.3 Georgia, "Times New Roman", serif; color: #f0ece7;
    }
    #title small { display: block; margin-top: 4px; font: 400 12px/1.35 system-ui, sans-serif; color: #9aa3b5; }
    #status {
      position: absolute; left: 12px; bottom: 12px; z-index: 2; max-width: 92vw;
      padding: 9px 12px; border-radius: 8px; font: 13px/1.4 system-ui, sans-serif;
      color: #eee; background: rgba(20,22,28,.85);
    }
    #status.err { color: #ffb4b4; background: #3a1c1c; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
      "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.11/build/index.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="title">ringclose<small>Draco · diamond sparkle · drag to orbit</small></div>
  <div id="status">Starting…</div>
  <script type="module">
    const el = document.getElementById('status');
    const set = (t, err = false) => { el.textContent = t; el.classList.toggle('err', !!err); };
    const MODEL = './ringclose_decoded.glb';

    try {
      const THREE = await import('three');
      const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');
      const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');
      const { EffectComposer } = await import('three/addons/postprocessing/EffectComposer.js');
      const { RenderPass } = await import('three/addons/postprocessing/RenderPass.js');
      const { UnrealBloomPass } = await import('three/addons/postprocessing/UnrealBloomPass.js');
      const { OutputPass } = await import('three/addons/postprocessing/OutputPass.js');
      const { MeshBVH, MeshBVHUniformStruct, BVHShaderGLSL, SAH } = await import('three-mesh-bvh');

      function studioEnv() {
        const w = 1024, h = 512;
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        const sky = ctx.createLinearGradient(0, 0, 0, h);
        sky.addColorStop(0, '#6a7188');
        sky.addColorStop(0.45, '#3d4458');
        sky.addColorStop(1, '#12151c');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, w, h);
        const glow = (x, y, r, a) => {
          const g = ctx.createRadialGradient(x, y, 0, x, y, r);
          g.addColorStop(0, `rgba(255,255,255,${a})`);
          g.addColorStop(0.45, `rgba(255,252,245,${a * 0.4})`);
          g.addColorStop(1, 'rgba(255,255,255,0)');
          ctx.fillStyle = g;
          ctx.fillRect(x - r, y - r, r * 2, r * 2);
        };
        glow(w * 0.5, h * 0.12, w * 0.38, 1.0);
        glow(w * 0.18, h * 0.32, w * 0.18, 0.85);
        glow(w * 0.82, h * 0.28, w * 0.18, 0.85);
        glow(w * 0.5, h * 0.72, w * 0.22, 0.55);
        for (let k = 0; k < 110; k += 1) {
          const a = Math.sin(k * 12.9898) * 43758.5453;
          const b = Math.sin(k * 7.137 + 2.3) * 24634.6345;
          glow((a - Math.floor(a)) * w, (b - Math.floor(b)) * h, w * 0.008, 1.0);
        }
        const tex = new THREE.Texture(c);
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.mapping = THREE.EquirectangularReflectionMapping;
        tex.needsUpdate = true;
        return tex;
      }

      function makeDiamondMaterial(env, camera) {
        return new THREE.ShaderMaterial({
          uniforms: {
            envMap: { value: env },
            bvh: { value: new MeshBVHUniformStruct() },
            viewMatrixInv: { value: camera.matrixWorld },
            bounces: { value: 4 },
            ior: { value: 2.417 },
            color: { value: new THREE.Color(1, 1, 1) },
            aberrationStrength: { value: 0.02 },
            envIntensity: { value: 1.35 },
          },
          vertexShader: /* glsl */ `
            varying vec3 vWorldPosition; varying vec3 vNormal; uniform mat4 viewMatrixInv;
            void main() {
              vWorldPosition = (modelMatrix * vec4(position, 1.0)).xyz;
              vNormal = normalize((viewMatrixInv * vec4(normalMatrix * normal, 0.0)).xyz);
              gl_Position = projectionMatrix * viewMatrix * modelMatrix * vec4(position, 1.0);
            }`,
          fragmentShader: /* glsl */ `
            #define RAY_OFFSET 0.001
            #include <common>
            precision highp isampler2D; precision highp usampler2D;
            ${BVHShaderGLSL.common_functions}
            ${BVHShaderGLSL.bvh_struct_definitions}
            ${BVHShaderGLSL.bvh_ray_functions}
            varying vec3 vWorldPosition; varying vec3 vNormal;
            uniform sampler2D envMap; uniform float bounces; uniform BVH bvh;
            uniform float ior; uniform vec3 color; uniform mat4 modelMatrix;
            uniform float aberrationStrength; uniform float envIntensity;
            #include <cube_uv_reflection_fragment>
            vec3 tir(vec3 origin, vec3 dir, vec3 normal, float iorVal, mat4 invModel) {
              vec3 rayOrigin = origin; vec3 rayDirection = dir;
              rayDirection = refract(rayDirection, normal, 1.0 / iorVal);
              rayOrigin = vWorldPosition + rayDirection * RAY_OFFSET;
              rayOrigin = (invModel * vec4(rayOrigin, 1.0)).xyz;
              rayDirection = normalize((invModel * vec4(rayDirection, 0.0)).xyz);
              for (float i = 0.0; i < bounces; i++) {
                uvec4 faceIndices = uvec4(0u); vec3 faceNormal = vec3(0.0, 0.0, 1.0);
                vec3 barycoord = vec3(0.0); float side = 1.0; float dist = 0.0;
                bvhIntersectFirstHit(bvh, rayOrigin, rayDirection, faceIndices, faceNormal, barycoord, side, dist);
                vec3 hitPos = rayOrigin + rayDirection * dist;
                bool isTir = length(refract(rayDirection, faceNormal, iorVal)) == 0.0;
                if (!isTir) { rayDirection = refract(rayDirection, faceNormal, iorVal); break; }
                rayDirection = reflect(rayDirection, faceNormal);
                rayOrigin = hitPos + rayDirection * RAY_OFFSET;
              }
              return normalize((modelMatrix * vec4(rayDirection, 0.0)).xyz);
            }
            vec4 envSample(vec3 d) { return texture(envMap, equirectUv(d)); }
            void main() {
              mat4 invModel = inverse(modelMatrix);
              vec3 n = normalize(vNormal);
              vec3 d = normalize(vWorldPosition - cameraPosition);
              if (!gl_FrontFacing) n = -n;
              vec3 r = tir(vWorldPosition, d, n, ior, invModel);
              vec3 rR = tir(vWorldPosition, d, n, ior * (1.0 + aberrationStrength), invModel);
              vec3 rB = tir(vWorldPosition, d, n, ior * (1.0 - aberrationStrength), invModel);
              vec4 c = vec4(envSample(rR).r, envSample(r).g, envSample(rB).b, 1.0) * vec4(color, 1.0);
              c.rgb *= envIntensity;
              gl_FragColor = c;
            }`,
        });
      }

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0c0e12);

      const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.01, 5000);

      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        powerPreference: 'high-performance',
        failIfMajorPerformanceCaveat: false,
      });
      if (!renderer.getContext()) throw new Error('WebGL context failed — close other 3D tabs and reload');
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.35;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      document.body.appendChild(renderer.domElement);

      const env = studioEnv();
      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromEquirectangular(env).texture;
      if ('environmentIntensity' in scene) scene.environmentIntensity = 1.35;
      pmrem.dispose();

      scene.add(new THREE.AmbientLight(0xffffff, 0.35));
      const key = new THREE.DirectionalLight(0xfff6e8, 1.6);
      key.position.set(2.5, 3.5, 2);
      scene.add(key);
      const fill = new THREE.DirectionalLight(0xdde6ff, 0.7);
      fill.position.set(-2.5, 1.5, -1.5);
      scene.add(fill);
      const rim = new THREE.DirectionalLight(0xffffff, 0.9);
      rim.position.set(0, 1.2, -3);
      scene.add(rim);

      set('Loading ring…');
      const gltf = await new GLTFLoader().loadAsync(MODEL);
      const root = gltf.scene;
      scene.add(root);
      root.updateMatrixWorld(true);

      // This export ships no punctual lights — studio env + directionals light the metal.
      let litSpots = 0;
      root.traverse((o) => {
        if (!o.isLight) return;
        litSpots += 1;
        o.visible = false;
        o.intensity = 0;
      });

      const isGem = (o, m) =>
        /gem|diamond|stone|side-diamond|top-diamond|main-diamond/i.test(o.name || '') ||
        /diamond|gem/i.test(m?.name || '') ||
        m?.userData?.adabMaterialRole === 'diamond' ||
        (m?.transmission ?? 0) > 0.05;

      const gemMeshes = [];
      root.traverse((o) => {
        if (!o.isMesh) return;
        o.frustumCulled = false;
        o.visible = true;
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        if (mats.some((m) => isGem(o, m))) {
          gemMeshes.push(o);
          o.renderOrder = 2;
          // Temporary clear gem so the band shows while BVH builds.
          o.material = new THREE.MeshPhysicalMaterial({
            color: 0xffffff,
            metalness: 0,
            roughness: 0.02,
            transmission: 1,
            ior: 2.417,
            thickness: 0.5,
            attenuationDistance: 1,
            attenuationColor: 0xffffff,
            clearcoat: 1,
            clearcoatRoughness: 0.02,
            envMapIntensity: 1.6,
            transparent: true,
          });
          return;
        }
        // Force readable yellow gold — GLB metal factor is often omitted (defaults to 1,
        // but a dark env still makes the band look nearly black).
        o.material = new THREE.MeshStandardMaterial({
          color: new THREE.Color(0.86, 0.62, 0.22),
          metalness: 1,
          roughness: 0.12,
          envMapIntensity: 1.8,
        });
      });

      const box = new THREE.Box3().setFromObject(root);
      if (box.isEmpty()) throw new Error('Empty bounds — mesh failed to load');
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const radius = Math.max(size.x, size.y, size.z) * 0.5;

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.autoRotate = true;
      controls.autoRotateSpeed = 0.55;
      controls.target.copy(center);

      // Face-on hero: look down the thin ring axis with a high 3/4 lift.
      const extents = [size.x, size.y, size.z];
      const axisIndex = extents.indexOf(Math.min(...extents));
      const ringAxis = new THREE.Vector3(axisIndex === 0 ? 1 : 0, axisIndex === 1 ? 1 : 0, axisIndex === 2 ? 1 : 0);
      const upHint = size.y >= size.z ? new THREE.Vector3(0, 1, 0) : new THREE.Vector3(0, 0, 1);
      const fit = (radius / Math.sin((camera.fov * Math.PI) / 360)) * 1.55;
      const dir = ringAxis.clone().multiplyScalar(0.9).add(upHint.multiplyScalar(0.65)).normalize();
      camera.position.copy(center).add(dir.multiplyScalar(fit));
      camera.near = Math.max(radius / 200, 0.001);
      camera.far = radius * 200;
      camera.updateProjectionMatrix();
      controls.minDistance = radius * 0.5;
      controls.maxDistance = radius * 20;
      controls.update();

      let useComposer = true;
      let composer = null;
      try {
        composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.28, 0.5, 0.95));
        composer.addPass(new OutputPass());
      } catch (e) {
        console.warn('composer failed', e);
        useComposer = false;
      }

      renderer.setAnimationLoop(() => {
        controls.update();
        if (useComposer && composer) composer.render();
        else renderer.render(scene, camera);
      });

      set(`Ring loaded · ${gemMeshes.length} stones · building sparkle…`);

      const byShape = new Map();
      let sparkled = 0;
      for (const o of gemMeshes) {
        const g = o.geometry;
        if (!g?.attributes?.position) continue;
        // BVH needs a non-indexed or properly indexed BufferGeometry.
        if (!g.index) {
          // ok
        }
        const sig = `${g.attributes.position.count}:${g.index ? g.index.count : 0}`;
        if (!byShape.has(sig)) {
          await new Promise((r) => setTimeout(r, 0));
          try {
            const bvh = new MeshBVH(g, { strategy: SAH, maxLeafTris: 4 });
            const mat = makeDiamondMaterial(env, camera);
            mat.uniforms.bvh.value.updateFrom(bvh);
            byShape.set(sig, mat);
          } catch (e) {
            console.warn('BVH failed', o.name, e);
            byShape.set(sig, null);
          }
        }
        const mat = byShape.get(sig);
        if (mat) {
          o.material = mat;
          sparkled += 1;
        }
      }

      set(`${gemMeshes.length} stones · ${sparkled} sparkled · Draco · drag to orbit`);
      console.log('[ringclose-draco]', { gems: gemMeshes.length, sparkled, litSpots, radius, center, size });

      addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
        if (composer) composer.setSize(innerWidth, innerHeight);
      });
    } catch (e) {
      console.error(e);
      set('Error: ' + (e?.message || e), true);
    }
  </script>
</body>
</html>
